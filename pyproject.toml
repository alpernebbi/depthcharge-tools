[build-system]
requires = ["setuptools >= 77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "depthcharge-tools"
version = "0.7.0.dev0"
description = "Tools to manage the Chrome OS bootloader"
readme = "README.rst"
maintainers = [
    {name = "Alper Nebi Yasak", email = "alpernebiyasak@gmail.com"},
]
license = "GPL-2.0-or-later"
license-files = ["LICENSE", "COPYRIGHT"]
classifiers=[
    'Development Status :: 4 - Beta',
    'Environment :: Console',
    'Intended Audience :: Developers',
    'Operating System :: POSIX :: Linux',
    'Programming Language :: Python :: 3',
    'Topic :: System :: Boot',
]
requires-python = ">= 3.9"
dependencies = [
    "packaging",
]
keywords = [
    'ChromeOS',
    'ChromiumOS',
    'depthcharge',
    'vboot',
    'vbutil_kernel',
]

[project.urls]
homepage = "https://github.com/alpernebbi/depthcharge-tools"

[project.scripts]
mkdepthcharge = "depthcharge_tools.mkdepthcharge:mkdepthcharge.main"
depthchargectl = "depthcharge_tools.depthchargectl:depthchargectl.main"

[tool.setuptools.packages]
find = {}

[tool.setuptools.package-data]
depthcharge_tools = ["config.ini", "boards.ini"]
