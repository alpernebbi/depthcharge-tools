# The format of this boards.ini file is not stable. Instead of relying
# on the section names and hierarchy here, you should add your own fully
# specified sections with a unique codename, then set that codename as
# your board, both in /etc/depthcharge-tools/config.d/*. For example:
#
#   [depthchargectl]
#   board = custom-kevin
#
#   [boards/custom/kevin]
#   arch = arm64
#   codename = custom-kevin
#   dt-compatible = google,kevin
#   image-format = fit
#   image-max-size = 512 MiB
#   name = Samsung Chromebook Plus (Custom coreboot)
#
#   [boards/custom/minnie]
#   arch = arm
#   codename = custom-minnie
#   dt-compatible = google,veyron-minnie
#   image-format = fit
#   image-max-size = 32 MiB
#   name = ASUS Chromebook Flip C100PA (Libreboot r20160907)
#

[boards/amd64]
arch = amd64
codename = amd64
loads-zimage-ramdisk = False
image-format = zimage

[boards/amd64/1M]
codename = amd64-generic-1M
image-start-address = 0x100000
name = Intel boards and older AMD boards

[boards/amd64/64M]
codename = amd64-generic-64M
image-start-address = 0x4000000
name = AMD boards since Picasso

[boards/amd64/alderlake]
codename = chipset-adl
image-start-address = 0x100000

[boards/amd64/alderlake/brya]
codename = brya
image-max-size = 512 MiB

